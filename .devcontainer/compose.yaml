name: "mallard"

services:
  rails-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
    - ../..:/workspaces:cached
    # Claude Code's config dir (auth, settings, history) lives on a named volume
    # so it survives container restarts and rebuilds.
    - claude-config:/home/vscode/.claude
    # Read-only view of the host's Claude Code config. bin/setup copies the
    # credentials and settings out of these into the volume above.
    - ${HOME}/.claude:/mnt/host-claude:ro
    - ${HOME}/.claude.json:/mnt/host-claude.json:ro

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Uncomment the next line to use a non-root user for all processes.
    # user: vscode

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)
    depends_on:
    - selenium

  selenium:
    image: selenium/standalone-chromium
    restart: unless-stopped

volumes:
  claude-config:
